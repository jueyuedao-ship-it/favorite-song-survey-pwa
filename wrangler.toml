name = "favorite-song-survey-api"
main = "worker/src/index.ts"
compatibility_date = "2026-07-30"
workers_dev = true

[vars]
GROQ_MODEL = "qwen/qwen3.8-27b"
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "favorite-song-survey"
# Replace only after creating a free-plan D1 database; no production binding exists yet.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/schema"

[triggers]
crons = ["* * * * *"]
